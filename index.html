<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">
<title>TTX TOURNAMENT FORM</title>

<!-- Professional icons: no emojis are used anywhere in the website. -->
<script src="https://unpkg.com/lucide@latest"></script>

<style>
:root{
  --bg:#070707;
  --panel:#111111;
  --panel2:#171717;
  --white:#ffffff;
  --muted:#a7a7a7;
  --line:#292929;
  --blue:#1687ff;
  --blue2:#55b0ff;
  --red:#ff2a2a;
  --green:#19c46b;
  --yellow:#ffd43b;
  --danger:#ff4545;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:#f5f5f5;
  color:#111;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{min-height:100vh}
.topbar{
  position:sticky;top:0;z-index:50;
  background:rgba(7,7,7,.96);
  color:#fff;
  border-bottom:1px solid #222;
  backdrop-filter:blur(12px);
}
.topbar-inner{
  max-width:1050px;margin:auto;
  display:grid;grid-template-columns:auto 1fr auto auto;
  align-items:center;gap:10px;padding:10px 14px;
}
.icon-btn{
  width:42px;height:42px;border:1px solid #333;border-radius:12px;
  background:#121212;color:#fff;display:grid;place-items:center;
}
.icon-btn:hover{border-color:#666}
.brand-title{font-weight:900;letter-spacing:.4px;font-size:15px}
.page{max-width:1050px;margin:auto;padding:18px 14px 50px}
.card{
  background:#fff;border:1px solid #ddd;border-radius:20px;
  box-shadow:0 10px 35px rgba(0,0,0,.06);
}
.hero{
  overflow:hidden;padding:28px 18px;text-align:center;
  background:linear-gradient(145deg,#fff,#ececec);
}
.logo{
  width:118px;height:118px;object-fit:cover;border-radius:50%;
  border:5px solid #111;box-shadow:0 0 0 5px #fff,0 0 30px rgba(0,0,0,.25);
}
.hero h1{margin:18px 0 4px;font-size:29px}
.hero p{margin:0;color:#666}
.btn{
  border:0;border-radius:13px;padding:13px 17px;font-weight:800;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:.2s transform,.2s box-shadow,.2s opacity;
}
.btn:active{transform:scale(.98)}
.btn-dark{background:#090909;color:#fff}
.btn-blue{background:var(--blue);color:#fff;box-shadow:0 0 18px rgba(22,135,255,.55)}
.btn-red{background:var(--red);color:#fff;box-shadow:0 0 18px rgba(255,42,42,.45)}
.btn-green{background:var(--green);color:#07140d}
.btn-light{background:#eee;color:#111}
.btn-danger{background:#e92b2b;color:#fff}
.register-btn{
  width:100%;margin-top:22px;padding:17px;font-size:18px;
  animation:pulse 1.8s infinite;
}
@keyframes pulse{
  0%,100%{box-shadow:0 0 10px rgba(22,135,255,.35)}
  50%{box-shadow:0 0 30px rgba(22,135,255,.85)}
}
.section{margin-top:18px;padding:18px}
.section-head{display:flex;justify-content:space-between;gap:12px;align-items:center}
.section-head h2{margin:0;font-size:19px}
.muted{color:#707070;font-size:13px}
.winner-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:14px}
.winner-card{background:#0b0b0b;color:#fff;border-radius:18px;padding:16px}
.winner-status{font-size:12px;color:#aaa;text-transform:uppercase;letter-spacing:1px}
.winner-photo{
  width:72px;height:72px;border-radius:50%;object-fit:cover;
  border:2px solid #fff;margin:12px 0
}
.winner-name{font-size:17px;font-weight:900}
.winner-row{display:flex;justify-content:space-between;gap:10px;margin-top:8px;font-size:13px;color:#bbb}
.winner-prize{color:#fff;font-weight:900}
.drawer-backdrop,.modal-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:100;
  display:none;
}
.drawer{
  position:absolute;right:0;top:0;height:100%;width:min(360px,92vw);
  background:#fff;padding:18px;overflow:auto
}
.drawer-head{display:flex;justify-content:space-between;align-items:center}
.drawer-item{
  width:100%;padding:14px;margin-top:9px;border:1px solid #ddd;
  background:#fafafa;border-radius:13px;text-align:left;display:flex;gap:12px;
  align-items:center;font-weight:800
}
.modal-backdrop{z-index:120;display:none;align-items:center;justify-content:center;padding:14px}
.modal{
  width:min(720px,100%);max-height:92vh;overflow:auto;background:#fff;
  border-radius:20px;padding:18px
}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.modal-head h2{margin:0;font-size:20px}
.close-btn{width:40px;height:40px;border:1px solid #ddd;background:#fff;border-radius:11px}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field label{font-size:12px;font-weight:800;color:#444}
.field input,.field select,.field textarea{
  border:1px solid #d7d7d7;border-radius:11px;padding:12px;background:#fff;
  outline:none
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#1687ff;box-shadow:0 0 0 3px rgba(22,135,255,.1)}
.notice{padding:12px;border-radius:12px;background:#f0f6ff;border:1px solid #cde4ff;color:#17456e;font-size:13px}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}
.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:4px}
.tab{border:1px solid #ddd;background:#f4f4f4;padding:10px 13px;border-radius:11px;font-weight:800;white-space:nowrap}
.tab.active{background:#111;color:#fff;border-color:#111}
.slot-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:13px}
.slot{
  padding:11px 5px;border-radius:10px;border:1px solid #ddd;background:#fff;font-weight:800;
}
.slot.available:hover{border-color:#1687ff;box-shadow:0 0 0 2px rgba(22,135,255,.1)}
.slot.selected{background:#19c46b;border-color:#19c46b;color:#06180e}
.slot.locked{background:#eee;color:#999;cursor:not-allowed}
.profile{
  border:1px solid #ddd;border-radius:16px;padding:14px;margin-top:12px
}
.profile-top{display:flex;gap:12px;align-items:center}
.profile-photo{width:65px;height:65px;border-radius:50%;object-fit:cover;background:#eee}
.status{
  display:inline-flex;padding:6px 9px;border-radius:99px;font-size:11px;font-weight:900
}
.status.pending{background:#fff4cf;color:#745600}
.status.selected{background:#d9f9e8;color:#08743c}
.status.rejected{background:#ffe0e0;color:#a50000}
.status.registered{background:#e4e4e4;color:#333}
.table-wrap{overflow:auto;margin-top:12px}
table{width:100%;border-collapse:collapse;min-width:700px}
th,td{padding:10px;border-bottom:1px solid #eee;text-align:left;font-size:13px}
th{background:#f4f4f4}
.admin-nav{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0}
.admin-nav button{padding:13px 8px;border:1px solid #ddd;background:#fafafa;border-radius:12px;font-weight:800}
.admin-nav button.active{background:#111;color:#fff}
.hidden{display:none!important}
.small{font-size:12px}
.qr{width:min(330px,100%);display:block;margin:12px auto;border-radius:12px;border:1px solid #ddd}
.empty{padding:28px;text-align:center;color:#777}

.pattern-lock{display:grid;grid-template-columns:repeat(3,72px);gap:18px;justify-content:center;padding:22px 0}
.pattern-dot{width:72px;height:72px;border-radius:50%;border:2px solid #bbb;background:#fff;position:relative;display:grid;place-items:center;touch-action:none;user-select:none}
.pattern-dot::after{content:"";width:18px;height:18px;border-radius:50%;background:#111}
.pattern-dot.active{border-color:#1687ff;box-shadow:0 0 20px rgba(22,135,255,.5)}
.pattern-dot.active::after{background:#1687ff}
.pattern-message{text-align:center;min-height:20px;color:#666;font-size:13px}
.security-list{display:grid;gap:10px;margin-top:14px}
.security-row{border:1px solid #ddd;border-radius:13px;padding:13px;display:flex;align-items:center;justify-content:space-between;gap:10px}

.toast{
  position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(20px);
  background:#111;color:#fff;padding:12px 16px;border-radius:12px;z-index:300;
  opacity:0;pointer-events:none;transition:.25s
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:650px){
  .topbar-inner{grid-template-columns:auto 1fr auto auto}
  .brand-title{font-size:13px}
  .form-grid{grid-template-columns:1fr}
  .field.full{grid-column:auto}
  .winner-grid{grid-template-columns:1fr}
  .admin-nav{grid-template-columns:repeat(2,1fr)}
  .slot-grid{grid-template-columns:repeat(5,1fr)}
}
</style>

<style>
.pattern-lock{position:relative;touch-action:none;user-select:none;-webkit-user-select:none}
.pattern-dot{cursor:pointer}
.pattern-dot span{width:18px;height:18px;border-radius:50%;background:#111;display:block;pointer-events:none}
.pattern-dot.active{border-color:#1687ff;box-shadow:0 0 20px rgba(22,135,255,.5)}
.pattern-dot.active span{background:#1687ff}
.btn-red{background:#e53935!important;color:#fff!important;box-shadow:0 0 18px rgba(229,57,53,.35)}
.winner-card{border:2px solid #ffd84d}
.winner-card .winner-status{font-weight:900}
</style>
</head>

<body>
<div class="app">

<header class="topbar">
  <div class="topbar-inner">
    <button class="icon-btn" onclick="openMenu()" aria-label="Menu"><i data-lucide="more-vertical"></i></button>
    <div class="brand-title" id="topTitle">TTX TOURNAMENT FORM</div>
    <button class="icon-btn" onclick="openSearch()" aria-label="Search"><i data-lucide="search"></i></button>
    <button class="icon-btn" onclick="openAdminLogin()" aria-label="Admin"><i data-lucide="shield"></i></button>
  </div>
</header>

<main class="page">
  <section class="card hero">
    <img id="channelLogo" class="logo" alt="TTX YTT Logo">
    <h1 id="channelName">TTX YTT</h1>
    <p>Official Tournament Registration</p>
    <div class="actions" style="justify-content:center">
      <button class="btn btn-red" onclick="subscribe()"><i data-lucide="youtube"></i> Subscribe</button>
      <button class="btn btn-red" onclick="watchVideo()"><i data-lucide="play"></i> Watch Form Joining Process</button>
    </div>
    <button class="btn btn-blue register-btn" onclick="openRegistration()">
      <i data-lucide="clipboard-pen"></i> REGISTER NOW
    </button>
  </section>

  <section class="card section">
    <div class="section-head">
      <div>
        <h2>Today's Winners</h2>
        <div class="muted">Winner information appears after Admin publishes the result.</div>
      </div>
    </div>
    <div class="winner-grid">
      <div class="winner-card" id="morningWinner"></div>
      <div class="winner-card" id="eveningWinner"></div>
    </div>
  </section>
</main>
</div>

<!-- MENU -->
<div class="drawer-backdrop" id="menuBackdrop" onclick="closeMenu(event)">
  <aside class="drawer" onclick="event.stopPropagation()">
    <div class="drawer-head">
      <strong>Menu</strong>
      <button class="close-btn" onclick="closeMenu()"><i data-lucide="x"></i></button>
    </div>
    <button class="drawer-item" onclick="closeMenu();openPayment()"><i data-lucide="credit-card"></i> Payment</button>
    <button class="drawer-item" onclick="closeMenu();openSections('A')"><i data-lucide="layout-grid"></i> Section A</button>
    <button class="drawer-item" onclick="closeMenu();openSections('B')"><i data-lucide="layout-grid"></i> Section B</button>
    <button class="drawer-item" onclick="closeMenu();openHelp()"><i data-lucide="circle-help"></i> Help</button>
  </aside>
</div>

<!-- GENERIC MODAL -->
<div class="modal-backdrop" id="modalBackdrop">
  <section class="modal" id="modalContent"></section>
</div>

<div class="toast" id="toast"></div>

function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg;t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),2400);
}
function iconRefresh(){ if(window.lucide) lucide.createIcons(); }

  document.getElementById("modalBackdrop").style.display="flex";

  document.getElementById("channelLogo").src=ASSETS.logo;
}
applySettings();

}

function openRegistration(){
  let selectedTime="Morning", selectedSection="A", selectedSlot=null;
  openModal(`
    <div class="modal-head"><h2>Register for Tournament</h2><button class="close-btn" onclick="closeModal()"><i data-lucide="x"></i></button></div>
    <div class="notice" style="margin-top:12px">Entry fee: ₹${settings.fee}. Payment is required for confirmation. Without payment, the application remains Pending.</div>

    <div class="tabs" style="margin-top:14px">
      <button class="tab active" id="timeMorning" onclick="pickTime('Morning')">Morning ${settings.morning}</button>
      <button class="tab" id="timeEvening" onclick="pickTime('Evening')">Evening ${settings.evening}</button>
    </div>

    <div class="tabs" style="margin-top:10px">
      <button class="tab active" id="secA" onclick="pickSection('A')">Section A</button>
      <button class="tab" id="secB" onclick="pickSection('B')">Section B</button>
    </div>

    <div style="margin-top:12px;font-weight:900">Choose Slot</div>
    <div class="slot-grid" id="registrationSlots"></div>

    <div class="form-grid" style="margin-top:18px">
      <div class="field"><label>Real Name</label><input id="realName" required></div>
      <div class="field"><label>Phone Number</label><input id="phone" inputmode="tel" required></div>
      <div class="field"><label>Free Fire In-Game Name</label><input id="gameName" required></div>
      <div class="field"><label>Game UID</label><input id="uid" required></div>
      <div class="field"><label>Profile Photo</label><input id="profilePhoto" type="file" accept="image/*" required></div>
      <div class="field"><label>Payment Screenshot</label><input id="paymentShot" type="file" accept="image/*" required></div>
      <div class="field full"><label>Optional Message</label><textarea id="payMessage" rows="3"></textarea></div>
    </div>

    <div class="actions">
      <button class="btn btn-light" onclick="closeModal()">Cancel</button>
      <button class="btn btn-blue" onclick="submitRegistration()"><i data-lucide="send"></i> Submit Registration</button>
    </div>
  `);

  window.pickTime=function(v){
    selectedTime=v;
    document.getElementById("timeMorning").classList.toggle("active",v==="Morning");
    document.getElementById("timeEvening").classList.toggle("active",v==="Evening");
    renderRegistrationSlots();
  };
  window.pickSection=function(v){
    selectedSection=v;
    document.getElementById("secA").classList.toggle("active",v==="A");
    document.getElementById("secB").classList.toggle("active",v==="B");
    renderRegistrationSlots();
  };
  window.chooseRegSlot=function(n){
    selectedSlot=n;
    renderRegistrationSlots();
  };
  function renderRegistrationSlots(){
    const el=document.getElementById("registrationSlots");
    el.innerHTML="";
    for(let n=1;n<=30;n++){
      const occupied=players.some(p=>p.date===todayKey()&&p.time===selectedTime&&p.section===selectedSection&&p.slot===n&&p.status!=="Rejected");
      const b=document.createElement("button");
      b.className="slot "+(occupied?"locked":(selectedSlot===n?"selected":"available"));
      b.textContent=n;
      b.disabled=occupied;
      if(!occupied)b.onclick=()=>chooseRegSlot(n);
      el.appendChild(b);
    }
  }
  renderRegistrationSlots();

  window.submitRegistration=async function(){
    const realName=document.getElementById("realName").value.trim();
    const phone=document.getElementById("phone").value.trim();
    const gameName=document.getElementById("gameName").value.trim();
    const uid=document.getElementById("uid").value.trim();
    const photo=document.getElementById("profilePhoto").files[0];
    const payment=document.getElementById("paymentShot").files[0];
    if(!selectedSlot || !realName || !phone || !gameName || !uid || !photo || !payment){
      toast("Please complete every required field and choose a slot.");
      return;
    }
    const duplicate=players.find(p=>p.date===todayKey()&&p.realName.toLowerCase()===realName.toLowerCase()&&p.phone===phone&&p.uid===uid);
    if(duplicate){
      toast("This player is already registered.");
      return;
    }
    const occupied=players.some(p=>p.date===todayKey()&&p.time===selectedTime&&p.section===selectedSection&&p.slot===selectedSlot&&p.status!=="Rejected");
    if(occupied){
      toast("This slot is already registered.");
      renderRegistrationSlots(); return;
    }
    const photoData=await fileToData(photo);
    const paymentData=await fileToData(payment);
    players.push({
      id:crypto.randomUUID(),date:todayKey(),time:selectedTime,section:selectedSection,slot:selectedSlot,
      realName,phone,gameName,uid,photo:photoData,payment:paymentData,
      message:document.getElementById("payMessage").value.trim(),
      status:"Pending",createdAt:new Date().toISOString()
    });
    saveAll();closeModal();
    toast("Registration submitted. Status: Pending.");
  };
}

  openModal(`
    <div class="modal-head"><h2>Payment</h2><button class="close-btn" onclick="closeModal()"><i data-lucide="x"></i></button></div>
    <div class="notice" style="margin-top:12px">Entry Fee: ₹${settings.fee}. Upload your payment screenshot after completing payment.</div>
    <img class="qr" src="${ASSETS.qr}" alt="Payment QR Code">
    <div class="actions">
      <button class="btn btn-dark" onclick="downloadQR()"><i data-lucide="download"></i> Download QR Code</button>
      <button class="btn btn-light" onclick="closeModal();openRegistration()"><i data-lucide="upload"></i> Upload Payment Screenshot</button>
    </div>
    <div class="field" style="margin-top:14px"><label>Optional Message</label><textarea id="paymentOnlyMessage" rows="3"></textarea></div>
    <div class="actions"><button class="btn btn-blue" onclick="toast('Payment screenshot is submitted through the registration form.');closeModal()">Submit</button></div>
  `);
}
function downloadQR(){
  const a=document.createElement("a");a.href=ASSETS.qr;a.download="TTX-Payment-QR.png";a.click();
}

function openSections(section){
  let time="Morning";
  openModal(`
    <div class="modal-head"><h2>Section ${section}</h2><button class="close-btn" onclick="closeModal()"><i data-lucide="x"></i></button></div>
    <div class="tabs" style="margin-top:14px">
      <button class="tab active" id="stMorning" onclick="showSectionTime('Morning')">Morning</button>
      <button class="tab" id="stEvening" onclick="showSectionTime('Evening')">Evening</button>
    </div>
    <div class="notice" style="margin-top:12px">Green slots are registered. Other slots are available.</div>
    <div class="slot-grid" id="sectionSlots"></div>
  `);
  window.showSectionTime=function(v){
    time=v;
    document.getElementById("stMorning").classList.toggle("active",v==="Morning");
    document.getElementById("stEvening").classList.toggle("active",v==="Evening");
    render();
  };
  function render(){
    const el=document.getElementById("sectionSlots");el.innerHTML="";
    for(let n=1;n<=30;n++){
      const occupied=players.some(p=>p.date===todayKey()&&p.time===time&&p.section===section&&p.slot===n&&p.status!=="Rejected");
      const b=document.createElement("button");
      b.className="slot "+(occupied?"selected":"available");
      b.textContent=n+(occupied?"  •":"");
      b.disabled=occupied;
      el.appendChild(b);
    }
  }
  render();
}

    <div class="modal-head"><h2>Search Player Status</h2><button class="close-btn" onclick="closeModal()"><i data-lucide="x"></i></button></div>

function passwordHash(value){return simpleHash(value);}
function patternHash(value){return simpleHash(value);}
function simpleHash(value){
  let h=2166136261;
  for(let i=0;i<value.length;i++){h^=value.charCodeAt(i);h=Math.imul(h,16777619);}
  return ("00000000"+(h>>>0).toString(16)).slice(-8);
}
function getSecurity(){
  const saved=JSON.parse(localStorage.getItem("ttx_security_master_v1")||"null");
  return saved || {
    passwordHash:simpleHash("TXA#74Qm!29"),
    patternHash:simpleHash("7-5-8-6-3")
  };
}

  openModal(`

      const n=Number(btn.dataset.dot); if(current.includes(n))return;

};

function openPatternStep(mode){
  openModal(`
    <div class="modal-head">
      <h2>Pattern Lock</h2>
      <button class="close-btn" onclick="closeModal()"><i data-lucide="x"></i></button>
    </div>
    <div class="notice" style="margin-top:12px">
      Press and drag continuously across the dots. Release only after the complete pattern.
      <br>No keyboard is used.
    </div>
    ${patternMarkup("masterPatternGrid")}
    <div class="pattern-message" id="masterPatternMessage">Draw your pattern.</div>
    <div class="actions">
      <button class="btn btn-light" onclick="closeModal()">Cancel</button>
      <button class="btn btn-blue" id="patternConfirmBtn" disabled>Unlock Admin</button>
    </div>
  `);

  const grid=document.getElementById("masterPatternGrid");
  const dots=[...grid.querySelectorAll(".pattern-dot")];
  let drawing=false, path=[], released=false;

  function pointFromEvent(e){
    const r=grid.getBoundingClientRect();
    return {x:e.clientX-r.left,y:e.clientY-r.top};
  }
  function hitDot(e){
    const p=pointFromEvent(e);
    let best=null, dist=Infinity;
    dots.forEach(dot=>{
      const r=dot.getBoundingClientRect();
      const cx=r.left+r.width/2-grid.getBoundingClientRect().left;
      const cy=r.top+r.height/2-grid.getBoundingClientRect().top;
      const d=Math.hypot(p.x-cx,p.y-cy);
      if(d<Math.min(r.width,r.height)*0.58 && d<dist){best=Number(dot.dataset.dot);dist=d;}
    });
    return best;
  }
  function activate(n){
    if(!n || path.includes(n)) return;
    path.push(n);
    const dot=grid.querySelector(`[data-dot="${n}"]`);
    if(dot) dot.classList.add("active");
    document.getElementById("masterPatternMessage").textContent=path.join(" → ");
    document.getElementById("patternConfirmBtn").disabled=false;
  }
  function resetPattern(){
    path=[]; drawing=false; released=false;
    dots.forEach(d=>d.classList.remove("active"));
    document.getElementById("masterPatternMessage").textContent="Draw your pattern.";
    document.getElementById("patternConfirmBtn").disabled=true;
  }

  grid.addEventListener("pointerdown",e=>{
    e.preventDefault();
    grid.setPointerCapture?.(e.pointerId);
    drawing=true; released=false; resetPattern(); drawing=true;
    activate(hitDot(e));
  });
  grid.addEventListener("pointermove",e=>{
    if(!drawing || released) return;
    e.preventDefault();
    activate(hitDot(e));
  });
  grid.addEventListener("pointerup",e=>{
    if(!drawing) return;
    e.preventDefault();
    drawing=false; released=true;
    if(path.length<4){
      document.getElementById("masterPatternMessage").textContent="Pattern must contain at least 4 points.";
      document.getElementById("patternConfirmBtn").disabled=true;
    }else{
      document.getElementById("masterPatternMessage").textContent=path.join(" → ")+" — ready";
    }
  });
  grid.addEventListener("pointercancel",()=>{
    drawing=false; released=true;
    resetPattern();
  });

  document.getElementById("patternConfirmBtn").onclick=()=>{
    if(drawing || !released || path.length<4){
      toast("Release after completing the pattern.");
      return;
    }
    if(patternHash(path.join("-"))!==getSecurity().patternHash){
      toast("Wrong Pattern. Try Again.");
      resetPattern();
      return;
    }
    adminSessionUnlocked=true;
    closeModal();
    openAdminPanel();
  };
}

function adminManageRules(){
  document.getElementById("adminBody").innerHTML=`
    <div class="notice">Type your tournament rules. Add, edit, delete, then save.</div>

function renderRulesEditor(){

  if(!el)return;

    <div class="field" style="margin-top:10px">
      <label>Rule ${i+1}</label>
      <div style="display:flex;gap:8px">

      </div>
    </div>`).join("") || '<div class="empty">No rules. Add a rule.</div>';

}
window.addRule=function(){ settings.rules=settings.rules||[]; settings.rules.push(""); renderRulesEditor(); };
window.deleteRule=function(i){ settings.rules.splice(i,1); renderRulesEditor(); };
window.saveRules=function(){
  const arr=[];
  (settings.rules||[]).forEach((_,i)=>{
    const el=document.getElementById("rule_"+i);
    if(el && el.value.trim()) arr.push(el.value.trim());
  });
  settings.rules=arr;
  saveAll();toast("Rules saved.");
};

/* ---------- Public sections use configured counts ---------- */
window.openSections=function(section){
  let time="Morning";
  openModal(`
    <div class="modal-head"><h2>Section ${section}</h2><button class="close-btn" onclick="closeModal()"><i data-lucide="x"></i></button></div>
    <div class="tabs" style="margin-top:14px">
      <button class="tab active" id="stMorning" onclick="showSectionTime('Morning')">Morning</button>
      <button class="tab" id="stEvening" onclick="showSectionTime('Evening')">Evening</button>
    </div>
    <div class="notice" style="margin-top:12px">Registered slots are shown as occupied.</div>
    <div class="slot-grid" id="sectionSlots"></div>
  `);
  window.showSectionTime=function(v){
    time=v;
    document.getElementById("stMorning").classList.toggle("active",v==="Morning");
    document.getElementById("stEvening").classList.toggle("active",v==="Evening");
    render();
  };
  function render(){
    const el=document.getElementById("sectionSlots"); if(!el)return;
    el.innerHTML="";
    const count=configuredSlotCount(time,section);
    for(let n=1;n<=count;n++){
      const occupied=players.some(p=>p.date===todayKey()&&p.time===time&&p.section===section&&p.slot===n&&p.status!=="Rejected");
      const b=document.createElement("button");
      b.className="slot "+(occupied?"selected":"available");
      b.textContent=n;
      b.disabled=occupied;
      el.appendChild(b);
    }
  }
  render();
};

/* ---------- Registration: exact final field order + dates + payment + review ---------- */

window.openRegistration=function(){
  let selectedTime="Morning", selectedSection="A", selectedSlot=null;
  let selectedDate=todayKey();
  let reviewed=false;
  let submitting=false;

  openModal(`
    <div class="modal-head"><h2>Register for Tournament</h2><button class="close-btn" onclick="closeModal()"><i data-lucide="x"></i></button></div>
    <div class="notice" style="margin-top:12px">Entry Fee: ₹${settings.fee}. Complete all required details and payment.</div>

    <div class="form-grid" style="margin-top:14px">
      <div class="field full">
        <label>Upload Profile Picture</label>
        <input id="regPhoto" type="file" accept="image/*" required>
      </div>
      <div class="field"><label>Real Name</label><input id="regRealName" required></div>
      <div class="field"><label>Mobile Number</label><input id="regMobile" inputmode="tel" required></div>
      <div class="field full">
        <label>WhatsApp Number</label>
        <div style="display:flex;gap:8px;align-items:center">
          <input id="regWhatsApp" inputmode="tel" required style="flex:1">
          <label style="display:flex;align-items:center;gap:5px;font-size:12px;white-space:nowrap">
            <input id="sameWhatsApp" type="checkbox" style="width:auto"> Same as Mobile
          </label>
        </div>
      </div>
      <div class="field"><label>Game Name</label><input id="regGameName" required></div>
      <div class="field"><label>UID</label><input id="regUID" inputmode="numeric" required></div>
    </div>

    <div class="field" style="margin-top:14px">
      <label>Date</label>
      <div class="tabs">
        <button class="tab active" id="dateToday" onclick="pickRegDate('${todayKey()}')">Today — ${prettyDate(todayKey())}</button>
        <button class="tab" id="dateTomorrow" onclick="pickRegDate('${tomorrowKey()}')">Tomorrow — ${prettyDate(tomorrowKey())}</button>
      </div>
    </div>

    <div class="tabs" style="margin-top:12px">
      <button class="tab active" id="timeMorning" onclick="pickRegTime('Morning')">Morning ${settings.morning}</button>
      <button class="tab" id="timeEvening" onclick="pickRegTime('Evening')">Evening ${settings.evening}</button>
    </div>

    <div class="tabs" style="margin-top:10px">
      <button class="tab active" id="secA" onclick="pickRegSection('A')">Section A</button>
      <button class="tab" id="secB" onclick="pickRegSection('B')">Section B</button>
    </div>

    <div style="margin-top:12px;font-weight:900">Choose Slot</div>
    <div class="slot-grid" id="registrationSlots"></div>

    <div class="card" style="margin-top:18px;padding:14px">
      <div style="font-weight:900">Payment</div>
      <img class="qr" src="${ASSETS.qr}" alt="Payment QR Code">
      <div class="actions">
        <button class="btn btn-dark" onclick="downloadQR()"><i data-lucide="download"></i> Download QR Code</button>
      </div>
      <div class="field" style="margin-top:10px">
        <label>Upload Payment Screenshot — Required</label>
        <input id="regPayment" type="file" accept="image/*" required>
      </div>
      <div class="field" style="margin-top:10px">
        <label>Optional Message</label>
        <textarea id="regMessage" rows="3"></textarea>
      </div>
      <div class="small" style="margin-top:8px">Use the close button above to exit/cancel this registration.</div>
    </div>

    <div id="reviewNotice" class="notice" style="margin-top:14px">
      Complete the form. Final submission will stay disabled until everything is filled and reviewed.
    </div>
    <div class="actions">
      <button class="btn btn-light" onclick="closeModal()">Cancel</button>
      <button class="btn btn-blue" id="reviewBtn" onclick="requestReview()" disabled>
        <i data-lucide="clipboard-check"></i> Review & Confirm
      </button>
      <button class="btn btn-blue hidden" id="finalSubmitBtn" onclick="finalSubmit()">
        <i data-lucide="send"></i> Final Submit
      </button>
    </div>
  `);

  function markDirty(){
    reviewed=false;
    registrationDraftDirty=true;
    document.getElementById("reviewBtn").disabled=!isComplete();
    document.getElementById("reviewBtn").classList.remove("hidden");
    document.getElementById("finalSubmitBtn").classList.add("hidden");
    const n=document.getElementById("reviewNotice");
    if(n)n.textContent="Form changed. Please review the complete form again before final submission.";
  }
  function isComplete(){
    return !!(
      document.getElementById("regPhoto")?.files[0] &&
      document.getElementById("regRealName")?.value.trim() &&
      document.getElementById("regMobile")?.value.trim() &&
      document.getElementById("regWhatsApp")?.value.trim() &&
      document.getElementById("regGameName")?.value.trim() &&
      document.getElementById("regUID")?.value.trim() &&
      selectedDate && selectedTime && selectedSection && selectedSlot &&
      document.getElementById("regPayment")?.files[0]
    );
  }
  window.pickRegDate=function(v){
    selectedDate=v;
    document.getElementById("dateToday").classList.toggle("active",v===todayKey());
    document.getElementById("dateTomorrow").classList.toggle("active",v===tomorrowKey());
    selectedSlot=null; renderSlots(); markDirty();
  };
  window.pickRegTime=function(v){
    selectedTime=v;
    document.getElementById("timeMorning").classList.toggle("active",v==="Morning");
    document.getElementById("timeEvening").classList.toggle("active",v==="Evening");
    selectedSlot=null; renderSlots(); markDirty();
  };
  window.pickRegSection=function(v){
    selectedSection=v;
    document.getElementById("secA").classList.toggle("active",v==="A");
    document.getElementById("secB").classList.toggle("active",v==="B");
    selectedSlot=null; renderSlots(); markDirty();
  };
  window.chooseRegSlot=function(n){selectedSlot=n;renderSlots();markDirty();};

  function renderSlots(){
    const el=document.getElementById("registrationSlots"); if(!el)return;
    el.innerHTML="";
    const count=configuredSlotCount(selectedTime,selectedSection);
    for(let n=1;n<=count;n++){
      const occupied=players.some(p=>p.date===selectedDate&&p.time===selectedTime&&p.section===selectedSection&&p.slot===n&&p.status!=="Rejected");
      const b=document.createElement("button");
      b.className="slot "+(occupied?"locked":(selectedSlot===n?"selected":"available"));
      b.textContent=n;b.disabled=occupied;
      if(!occupied)b.onclick=()=>chooseRegSlot(n);
      el.appendChild(b);
    }
  }
  function validateDuplicate(){
    const name=document.getElementById("regRealName").value.trim().toLowerCase();
    const mobile=document.getElementById("regMobile").value.trim();
    const uid=document.getElementById("regUID").value.trim();
    return players.find(p=>p.realName.toLowerCase()===name&&p.mobile===mobile&&p.uid===uid&&p.status!=="Rejected");
  }
  function collect(){
    return {
      photo:document.getElementById("regPhoto").files[0],
      realName:document.getElementById("regRealName").value.trim(),
      mobile:document.getElementById("regMobile").value.trim(),
      whatsapp:document.getElementById("regWhatsApp").value.trim(),
      gameName:document.getElementById("regGameName").value.trim(),
      uid:document.getElementById("regUID").value.trim(),
      payment:document.getElementById("regPayment").files[0],
      message:document.getElementById("regMessage").value.trim()
    };
  }
  window.requestReview=function(){
    if(!isComplete()){toast("Complete every required field, slot and payment screenshot first.");return;}
    const dup=validateDuplicate();
    if(dup){toast("Already Registered.");return;}
    const c=collect();
    const ok=window.confirm(
      "Please check your complete form carefully.\n\n" +
      "Game Name: "+c.gameName+"\n" +
      "UID: "+c.uid+"\n" +
      "Date: "+prettyDate(selectedDate)+"\n" +
      "Time: "+selectedTime+"\n" +
      "Section: "+selectedSection+"\n" +
      "Slot: "+selectedSlot+"\n\n" +
      "Press OK to continue to the form for the final review."
    );
    if(!ok)return;
    reviewed=true;
    registrationDraftDirty=false;
    document.getElementById("reviewBtn").classList.add("hidden");
    document.getElementById("finalSubmitBtn").classList.remove("hidden");
    document.getElementById("finalSubmitBtn").disabled=false;
    const n=document.getElementById("reviewNotice");
    if(n)n.textContent="Review completed. You can now scroll through the form. If you change anything, the review will be required again.";
  };
  window.finalSubmit=async function(){
    if(submitting)return;
    if(!reviewed || registrationDraftDirty){
      toast("Please review the form again before final submit.");
      return;
    }
    const c=collect();
    if(!isComplete()){toast("Form is incomplete.");return;}
    const dup=validateDuplicate();
    if(dup){toast("Already Registered.");return;}
    const occupied=players.some(p=>p.date===selectedDate&&p.time===selectedTime&&p.section===selectedSection&&p.slot===selectedSlot&&p.status!=="Rejected");
    if(occupied){toast("This slot is already registered.");closeModal();return;}
    submitting=true;
    const photoData=await fileToData(c.photo);
    const paymentData=await fileToData(c.payment);
    players.push({
      id:crypto.randomUUID(),date:selectedDate,time:selectedTime,section:selectedSection,slot:selectedSlot,
      realName:c.realName,mobile:c.mobile,whatsapp:c.whatsapp,phone:c.mobile,
      gameName:c.gameName,uid:c.uid,photo:photoData,payment:paymentData,message:c.message,
      status:"Pending",createdAt:new Date().toISOString()
    });
    saveAll();closeModal();toast("Registration submitted. Status: Pending.");
  };

  ["regPhoto","regRealName","regMobile","regWhatsApp","regGameName","regUID","regPayment","regMessage"].forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.addEventListener("input",markDirty);
    if(el) el.addEventListener("change",markDirty);
  });
  document.getElementById("sameWhatsApp").addEventListener("change",e=>{
    const w=document.getElementById("regWhatsApp");
    if(e.target.checked){w.value=document.getElementById("regMobile").value;w.readOnly=true;}
    else{w.readOnly=false;}
    markDirty();
  });
  document.getElementById("regMobile").addEventListener("input",e=>{
    if(document.getElementById("sameWhatsApp").checked){
      document.getElementById("regWhatsApp").value=e.target.value;
    }
  });
  renderSlots();
};

    <div class="tabs" style="margin-top:14px">
      <button class="tab active" onclick="helpTabMaster('rules',this)">Rules</button>

    document.querySelectorAll("#modalContent .tab").forEach(x=>x.classList.remove("active"));

    if(type==="rules"){
      body.innerHTML=`<div class="notice"><strong>Tournament Rules</strong><br><br>${
        (settings.rules||[]).map((r,i)=>`${i+1}. ${escapeHTML(r)}<br><br>`).join("")

      body.innerHTML=`<div class="notice">Use the Watch Form Joining Process button on the home screen.<br><br>${
        settings.videoLink ? "The Admin-configured joining process video is available there." : "The joining process video link is not configured yet."
      }</div>`;
    } else {
      body.innerHTML=`
        <div class="field"><label>Your Message</label><textarea id="helpMessage" rows="4"></textarea></div>
        <div class="actions"><button class="btn btn-blue" onclick="sendHelpMaster()"><i data-lucide="send"></i> Send</button></div>`;
    }
    iconRefresh();
  };
  window.sendHelpMaster=function(){
    const text=document.getElementById("helpMessage").value.trim();
    if(!text){toast("Write a message first.");return;}
    const msgs=JSON.parse(localStorage.getItem("ttx_help_messages")||"[]");
    msgs.push({id:crypto.randomUUID(),text,reply:"",createdAt:new Date().toISOString()});
    localStorage.setItem("ttx_help_messages",JSON.stringify(msgs));
    toast("Message sent to Admin.");closeModal();
  };
  document.querySelector("#modalContent .tab").click();
};

  ["Morning","Evening"].forEach(time=>{

      <div class="winner-name">${escapeHTML(w.gameName)}</div>
      <div class="winner-row"><span>UID</span><strong>${escapeHTML(w.uid)}</strong></div>
      <div class="winner-row" style="background:#ffd84d;padding:8px;border-radius:10px;margin-top:8px"><span>Prize</span><span class="winner-prize">₹${w.prize}</span></div>`;
    }
  });
}
